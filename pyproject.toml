[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "searchcans"
version = "0.1.0"
description = "Official Python SDK for the SearchCans SERP API and Reader API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SearchCans", email = "support@searchcans.com" }]
keywords = ["searchcans", "serp", "reader", "rag", "seo", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6", "twine>=5"]
docs = ["mkdocs>=1.6"]

[project.urls]
Homepage = "https://www.searchcans.com/"
Documentation = "https://searchcans.github.io/searchcans-python/"
Repository = "https://github.com/SearchCans/searchcans-python"
Issues = "https://github.com/SearchCans/searchcans-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/searchcans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
