name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Annotated release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Verify annotated release tag and package version
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release ref must be a version tag such as v0.1.0."; exit 1 ;;
          esac

          if ! tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG" 2>/dev/null)"; then
            echo "Release tag does not exist: $RELEASE_TAG"
            exit 1
          fi
          if [ "$tag_type" != "tag" ]; then
            echo "Release ref must be an annotated Git tag: $RELEASE_TAG"
            exit 1
          fi
          if [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Checked-out commit does not match release tag: $RELEASE_TAG"
            exit 1
          fi

          python - "$RELEASE_TAG" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          tag_version = sys.argv[1].removeprefix("v")
          with Path("pyproject.toml").open("rb") as file:
              package_version = tomllib.load(file)["project"]["version"]
          if package_version != tag_version:
              raise SystemExit(
                  f"Tag version {tag_version} does not match pyproject.toml version {package_version}."
              )
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/searchcans
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
